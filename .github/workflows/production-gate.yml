name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web / Cloudflare build gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22.13
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Portal parser unit tests
        run: npm run test:unit

      - name: Verified production build
        run: npm run build

      - name: Validate built Cloudflare artifact
        run: npm run validate:artifact

  android-agent:
    name: Android agent gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automation-agent/pyproject.toml

      - name: Install agent and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./automation-agent pytest

      - name: Compile Python sources
        run: python -m compileall -q automation-agent/src automation-agent/tests

      - name: Agent tests
        run: python -m pytest -q automation-agent/tests

  migrations:
    name: Migration integrity gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate migration history
        run: python scripts/validate-migrations.py

  production-gate:
    name: Production Gate
    if: always()
    needs: [web, android-agent, migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          WEB_RESULT: ${{ needs.web.result }}
          AGENT_RESULT: ${{ needs.android-agent.result }}
          MIGRATION_RESULT: ${{ needs.migrations.result }}
        run: |
          echo "web=$WEB_RESULT agent=$AGENT_RESULT migrations=$MIGRATION_RESULT"
          test "$WEB_RESULT" = "success"
          test "$AGENT_RESULT" = "success"
          test "$MIGRATION_RESULT" = "success"